<div class="layout">
  <aside [class.collapsed]="isCollapsed" class="sidebar">
    <div class="sidebar-header">
      <button class="toggle-btn" (click)="toggleSidebar()">
        <mat-icon>{{ isCollapsed ? 'menu' : 'menu_open' }}</mat-icon>
      </button>
      <div class="logo-container" *ngIf="!isCollapsed">
        <div class="bofa-logo">Bank of America</div>
      </div>
    </div>

    <nav>
      <ul class="navbar-nav">
        <li *ngFor="let menu of mainMenus" class="nav-item">
          <div class="nav-link"
               [class.active]="openDropdownId === menu.menuOptionNo"
               [routerLink]="getSubMenus(menu.menuOptionNo).length === 0 ? ['/', menu.slugTx] : null"
               (click)="toggleDropdown(menu.menuOptionNo)">
            <div class="nav-link-content">
              <mat-icon class="menu-icon">{{ getMenuIcon(menu.menuOptionTx) }}</mat-icon>
              <span class="menu-text">{{ menu.menuOptionTx }}</span>
            </div>
            <span *ngIf="getSubMenus(menu.menuOptionNo).length > 0"
                  class="arrow"
                  [style.transform]="openDropdownId === menu.menuOptionNo ? 'rotate(180deg)' : 'rotate(0deg)'">
              <mat-icon>expand_more</mat-icon>
            </span>
          </div>

          <ul *ngIf="openDropdownId === menu.menuOptionNo && !isCollapsed" class="dropdown-menu">
            <li *ngFor="let submenu of getSubMenus(menu.menuOptionNo)"
                class="dropdown-item"
                [routerLink]="['/', submenu.slugTx]"
                routerLinkActive="active">
              <mat-icon class="submenu-icon">fiber_manual_record</mat-icon>
              <span class="submenu-text">{{ submenu.menuOptionTx }}</span>
            </li>
          </ul>
        </li>
      </ul>
    </nav>
  </aside>

  <main class="content">
    <div class="content-logo-wrapper" [class.collapsed]="isCollapsed">
      <div class="content-logo">
        <img src="/bofa-logo.svg" alt="Bank of America" class="bofa-icon" />
      </div>
      <div class="header-center-title">
        <h2 class="rewards-admin-title">Rewards Admin</h2>
      </div>
      <div class="header-right"></div>
    </div>
    <div class="center-content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
