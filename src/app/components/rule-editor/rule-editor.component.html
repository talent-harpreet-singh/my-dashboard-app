<div class="rule-editor-scroll">
  <div class="rule-section">
    <app-rule-details [details]="ruleDetails"></app-rule-details>
  </div>
  <div class="rule-section">
    <app-dynamic-form
      [title]="'PR / RR Bonus Rule Details'"
      [fields]="ruleFormFields"
      [formData]="ruleDetails"
      (fieldChange)="onFieldChange($event)"
      (modalOpen)="onModalOpen($event)"
    ></app-dynamic-form>
  </div>
  <div class="rule-section">
    <app-notes-section [notes]="notes" [showDelete]="showDelete" (noteAdded)="onNoteAdded()"></app-notes-section>
  </div>
  <div class="rule-section">
    <app-programs-table
      [programs]="programs"
      [headerBackgroundColor]="'#0f4ea8'"
      [tableBackgroundColor]="'#eaf4ff'">
    </app-programs-table>
  </div>
  <div class="button-bar">
    <button (click)="saveLocally()">💾 Save Locally</button>
    <button (click)="clearStorage()">🧹 Clear Storage</button>
  </div>
</div>

<app-tier-profile-modal
  *ngIf="showModal"
  [title]="activeModal?.modalConfig?.title || ''"
  [columns]="activeModal?.modalConfig?.columns || []"
  [displayKeys]="activeModal?.modalConfig?.displayKeys || []"
  [data]="activeModal?.modalConfig?.data || []"
  (cancel)="showModal = false"
  (rowClick)="onModalSelect($event)"
></app-tier-profile-modal>
